apiVersion: v1
kind: Service
metadata:
  name: musei-postgresql
  namespace: museum-prod
  labels:
    app.kubernetes.io/name: musei-postgresql
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: musei-postgresql
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: musei-postgresql
  namespace: museum-prod
  labels:
    app.kubernetes.io/name: musei-postgresql
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: musei-kasteev
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: musei-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: musei-postgresql
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: musei-kasteev
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: bitnami/postgresql:16
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRESQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: musei-postgres
                  key: database
            - name: POSTGRESQL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: musei-postgres
                  key: username
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: musei-postgres
                  key: password
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRESQL_USERNAME\" -d \"$POSTGRESQL_DATABASE\""]
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRESQL_USERNAME\" -d \"$POSTGRESQL_DATABASE\""]
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 375m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: postgresql-data
              mountPath: /bitnami/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: postgresql-data
          persistentVolumeClaim:
            claimName: musei-postgresql-data
        - name: tmp
          emptyDir: {}
