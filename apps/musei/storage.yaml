apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: musei-sqlite-data
  namespace: museum-prod
  labels:
    app.kubernetes.io/name: musei-api
    app.kubernetes.io/component: database
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: microk8s-hostpath
  resources:
    requests:
      storage: 2Gi
