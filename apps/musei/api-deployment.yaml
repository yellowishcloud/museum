apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: musei-api
  namespace: museum-prod
  labels:
    app.kubernetes.io/name: musei-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: musei-kasteev
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: musei-api
  strategy:
    canary:
      maxSurge: 1
      maxUnavailable: 0
      steps:
        - setWeight: 50
        - pause:
            duration: 20s
        - setWeight: 100
  template:
    metadata:
      labels:
        app.kubernetes.io/name: musei-api
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: musei-kasteev
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4173"
        prometheus.io/path: "/api/healthz"
    spec:
      serviceAccountName: musei-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fetch-source
          image: alpine/git:2.47.2
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              git clone --depth=1 --branch=main http://museum-git.gitops.svc.cluster.local:8000/museum.git /workspace/src
              cp -R /workspace/src/. /app
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 75m
              memory: 96Mi
          volumeMounts:
            - name: app-source
              mountPath: /app
            - name: git-workspace
              mountPath: /workspace
      containers:
        - name: api
          image: node:24-alpine
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              npm ci --omit=dev
              node --no-warnings server.js
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "4173"
            - name: NPM_CONFIG_CACHE
              value: /tmp/.npm
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: musei-postgres
                  key: database-url
            - name: MUSEI_DEMO_VISITOR_EMAIL
              value: demo@musei.local
            - name: MUSEI_DEMO_VISITOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: musei-demo-visitor
                  key: password
                  optional: true
            - name: MUSEI_DEMO_ADMIN_EMAIL
              value: admin@musei.local
            - name: MUSEI_DEMO_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: musei-demo-admin
                  key: password
                  optional: true
          ports:
            - name: http
              containerPort: 4173
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 25
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 375m
              memory: 576Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: app-source
              mountPath: /app
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: app-source
          emptyDir: {}
        - name: git-workspace
          emptyDir: {}
        - name: tmp
          emptyDir: {}


